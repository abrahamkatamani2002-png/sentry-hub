<section class="panel" id="password">
  <div class="panel-head"><h2>Change password</h2><p>A new salt is generated every time you change it.</p></div>
  <form method="post" action="{{ url_for('dash.change_password') }}" class="form form-narrow" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field"><span>Current password</span>
      <input type="password" name="current" autocomplete="current-password" required></label>
    <label class="field"><span>New password</span>
      <input type="password" name="new" autocomplete="new-password" required minlength="10"></label>
    <label class="field"><span>Confirm new password</span>
      <input type="password" name="confirm" autocomplete="new-password" required></label>
    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
</section>
