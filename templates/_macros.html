{% macro logo(size=34) %}
<svg class="logo-mark" width="{{ size }}" height="{{ size }}" viewBox="0 0 40 40" aria-hidden="true">
  <defs>
    <linearGradient id="lg{{ size }}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <path d="M20 2.5 34.5 8v10.2c0 9.1-5.9 16.2-14.5 19.3C11.4 34.4 5.5 27.3 5.5 18.2V8L20 2.5Z" fill="url(#lg{{ size }})"/>
  <path d="m13.5 20.5 4.8 4.8 8.7-9.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
{% endmacro %}

{% macro role_pill(role) %}<span class="pill pill-{{ role }}">{{ role|capitalize }}</span>{% endmacro %}

{# `color` is the member's chosen avatar colour (0-5); without one the colour follows their id. #}
{% macro avatar(name, uid=0, size="", color=None) %}<span class="avatar av-{{ (color if color is not none else uid) % 6 }} {{ size }}">{{ name|initials }}</span>{% endmacro %}
