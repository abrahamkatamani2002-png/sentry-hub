{% extends "base.html" %}
{% from "_macros.html" import logo %}
{% block title %}{{ title }}{% endblock %}
{% block body_class %}error-page{% endblock %}
{% block body %}
<main class="error-wrap">
  <a class="brand brand-dark" href="{{ url_for('auth.landing') }}">{{ logo(34) }}<span>Sentry Hub</span></a>
  <div class="error-card">
    <span class="error-code">{{ code }}</span>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('auth.landing') }}">Back to home</a>
  </div>
</main>
{% endblock %}
