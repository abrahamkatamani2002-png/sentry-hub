<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="theme-color" content="#0b1020">
  <title>{% block title %}{{ app_name }}{% endblock %} · Sentry Hub</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}

  <div class="toasts" id="toasts" aria-live="polite">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="toast toast-{{ category }}" role="status">{{ message }}</div>
      {% endfor %}
    {% endwith %}
  </div>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog">
      <h3 id="confirm-title">Are you sure?</h3>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button value="cancel" class="btn btn-ghost">Cancel</button>
        <button value="ok" class="btn btn-danger" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
